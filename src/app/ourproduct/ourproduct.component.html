<app-page-header>
    <h1 class="text-success2">Our Product</h1>

</app-page-header>
<!-- Product view OPEN -->

    <div class="row mt-3">
        <div class="col-md-12 py-3 text-center">
            <span class="text-secondary">What we Offer</span>

        </div>
    </div>
    <div class="row">
        <div class="col-md-12 justify-content-center">
            <app-product-shortview [productview]="productdb"></app-product-shortview>

    </div>

        <div class="col-md-12 py-3 text-center">
            <span class="text-secondary">Special Offer for Flakes</span>
            <h2 class="text-success2 fw-bold">Flakes Packages</h2>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12 justify-content-center">
            <app-product-shortview [productflex]="productflex"></app-product-shortview>
        </div>
    </div>


    <div class="container py-5">
        <div class="row">
            <div class="col-md-12 py-3 text-center">
                <span class="text-secondary">Special Product for Bulk</span>
                <h2 class="text-success2 fw-bold">Bulk Packages Order</h2>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12 justify-content-center">
                <app-product-shortview [productbulk]="bulkproduct"></app-product-shortview>
            </div>
        </div>
    </div>
